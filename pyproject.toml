[project]
name = "iris-berlin-harvester"
version = "1.0.0"
description = "Berlin Bebauungspläne Portal Harvester for IRIS Technical Assignment (IRIS-SIG-17)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.1.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy>=2.0.29",
    "geoalchemy2>=0.14.0",
    "psycopg2-binary>=2.9.9",
    "pyproj>=3.6.0",
    "shapely>=2.0.4",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
