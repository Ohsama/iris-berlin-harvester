version: "3.9"

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: iris-postgis-16
    restart: unless-stopped
    environment:
      POSTGRES_DB: iris_intelligence
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./validation/validation.sql:/docker-entrypoint-initdb.d/init_validation.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d iris_intelligence"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
